<!DOCTYPE html>
<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Profile Kelas</title>
    <link rel="stylesheet" href="style.css">

<body>

    <header>

                <div class="foto-box">
                    <img src="irfan.jpg" alt="Irfan">
                    <p>Irfan</p>
                </div>
                <div class="foto-box">
                    <img src="vanni.jpeg" alt="Vanni">

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Web Profile Kelas. Created with ❤️</p>
    </footer>

</html>
