<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Profil Siswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar / Menu Atas -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🏫 Parung PanjangSpace </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- Detail Profil Siswa -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                {% if siswa %}
                <div class="card shadow border-0">
                    <div class="card-header bg-white text-center py-4">
                        <h3 class="fw-bold mb-0">{{ siswa.nama }}</h3>
                    </div>
                    <div class="card-body p-4">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item"><strong>No. Absen:</strong> {{ siswa.absen }}</li>
                            <li class="list-group-item"><strong>Hobi:</strong> {{ siswa.hobi }}</li>
                        </ul>
                        <div class="mt-4 text-center">
                            <a href="/" class="btn btn-outline-secondary">← Kembali ke Dashboard</a>
                        </div>
                    </div>
                </div>
                {% else %}
                <div class="alert alert-danger text-center">
                    Siswa tidak ditemukan! <a href="/">Kembali</a>
                </div>
                {% endif %}
            </div>
        </div>
    </div>

</body>
</html>
